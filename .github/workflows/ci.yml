name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Verify generated artifacts and dist integrity
        run: |
          if ! git diff --exit-code -- scripts/articles-meta.json public/llms.txt; then
            echo "::error::Generated artifacts differ from committed state. Run npm run build and commit the output."
            exit 1
          fi
          node --input-type=module -e '
            import fs from "node:fs";
            import { guardHits } from "./scripts/upstream-guard.mjs";
            for (const f of ["dist/index.html", "dist/404.html", "dist/sitemap.xml", "dist/llms.txt", "dist/upstream/index.html"]) {
              if (!fs.existsSync(f) || fs.statSync(f).size === 0) {
                throw new Error(`Missing or empty build artifact: ${f}`);
              }
            }
            const upstreamHtml = fs.readFileSync("dist/upstream/index.html", "utf8");
            if (guardHits(upstreamHtml).length > 0 || /approv/i.test(upstreamHtml)) {
              throw new Error("dist/upstream/index.html failed upstream guard check");
            }
          '
