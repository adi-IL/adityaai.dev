<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404  -  Page Not Found | Aditya Gaurav</title>
  <meta name="robots" content="noindex" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    h1 { font-size: clamp(4rem, 12vw, 8rem); margin: 0; line-height: 1; }
    p { color: #a1a1aa; font-size: 1.125rem; margin: 1rem 0 2rem; }
    a {
      color: #a1a1aa; text-decoration: none;
      border: 1px solid #27272a; border-radius: 9999px;
      padding: 0.75rem 1.5rem; font-size: 0.75rem;
      text-transform: uppercase; letter-spacing: 0.1em;
      font-family: 'JetBrains Mono', monospace;
      display: inline-block;
      transition: color 0.3s, border-color 0.3s;
    }
    a:hover { color: #caff4a; border-color: #caff4a; }
  </style>
</head>
<body>
  <div>
    <h1>404</h1>
    <p>This page doesn't exist or has been moved.</p>
    <a href="/">Back home</a>
  </div>
</body>
</html>
